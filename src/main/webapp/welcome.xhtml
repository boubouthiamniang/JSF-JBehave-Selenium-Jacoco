<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Welcome</title>
</h:head>
<h:body>
    <h1>Welcome, #{loginBean.username}!</h1>
    <h:form>
        <h:dataTable value="#{loginBean.allUsers}" var="user" styleClass="user-table">
            <h:column>
                <f:facet name="header">Select</f:facet>
                <h:selectBooleanCheckbox value="#{loginBean.selectedUsers[user]}" />
            </h:column>

            <h:column>
                <f:facet name="header">Username</f:facet>
                #{user}
            </h:column>

            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandButton value="Update" action="#{loginBean.updateUser(user)}" />
                <h:commandButton value="Remove" action="#{loginBean.removeUser(user)}" />
            </h:column>
        </h:dataTable>

        <h:commandButton value="Update Selected" action="#{loginBean.updateSelectedUsers()}" />
        <h:commandButton value="Remove Selected" action="#{loginBean.removeSelectedUsers()}" />
    </h:form>
</h:body>
</html>
