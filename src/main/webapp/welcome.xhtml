<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Welcome</title>
</h:head>
<h:body>
    <h1>Welcome, #{loginBean.username}!</h1>

    <h:form>
        <h:commandButton id="logoutButton" value="Logout" action="#{loginBean.logout}" />
    </h:form>

    <h:form>
        <h:dataTable value="#{loginBean.allUsers}" var="user" styleClass="user-table">
            <h:column>
                <f:facet name="header">Select</f:facet>
                <h:selectOneRadio value="#{loginBean.selectedUser}" >
                    <f:selectItem itemValue="#{user}" itemLabel="#{user}" />
                </h:selectOneRadio>
            </h:column>
            <h:column>
                <f:facet name="header">Username</f:facet>
                #{user}
            </h:column>
        </h:dataTable>

        <h:commandButton id="goToUpdatePageButton" value="Update Selected User" action="#{loginBean.goToUpdatePage}" />
        <h:commandButton id="deleteUserButton" value="Delete Selected User" action="#{loginBean.deleteUser}" />
    </h:form>
</h:body>
</html>
