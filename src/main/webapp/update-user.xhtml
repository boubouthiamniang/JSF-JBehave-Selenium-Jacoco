<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Update User</title>
</h:head>
<h:body>
    <h1>Update User</h1>
    <h:form>
        <h:outputLabel for="newUsername" value="New Username:" />
        <h:inputText id="newUsername" value="#{loginBean.newUsername}" />

        <h:outputLabel for="newPassword" value="New Password:" />
        <h:inputSecret id="newPassword" value="#{loginBean.newPassword}" />

        <h:commandButton id="updateUserButton" value="Save" action="#{loginBean.updateUser}" />
        <h:commandButton value="Cancel" action="welcome.xhtml?faces-redirect=true" />
    </h:form>
</h:body>
</html>
